# Oude WordPress-URL's (WPML ?lang=) naar de nieuwe structuur.
[[redirects]]
  from = "/"
  query = { lang = "en" }
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/site/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/wp-content/uploads/2018/02/Algemene-voorwaarden-NL-v201709.pdf"
  to = "/documenten/algemene-voorwaarden.pdf"
  status = 301
[[redirects]]
  from = "/wp-content/uploads/2018/02/Neo-Disclaimer-website.pdf"
  to = "/documenten/disclaimer.pdf"
  status = 301
[[redirects]]
  from = "/wp-content/uploads/2018/02/Neo-Databescherming.pdf"
  to = "/documenten/databescherming.pdf"
  status = 301
[[redirects]]
  from = "/wp-content/uploads/2018/02/Neo-Klachtenregeling.pdf"
  to = "/documenten/klachtenregeling.pdf"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
