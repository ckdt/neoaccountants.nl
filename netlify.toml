[build]
  command = "npm run build"
  publish = "dist"
  # Geen build bij alleen documentatie. Let op: content staat óók in .md (src/content/),
  # daarom alleen de docs in de root uitsluiten, niet alle *.md (afwijking van DEPLOY.md).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)README.md' ':(exclude)CHANGELOG.md' ':(exclude)AGENTS.md' ':(exclude)CLAUDE.md' ':(exclude).github/' ':(exclude).vscode/'"

[build.environment]
  NODE_VERSION = "22"

# Alle andere Neo-domeinen (DNS bij Strato, als alias aan deze site gekoppeld) → hoofdadres
# www.neoaccounting.nl. Host-specifiek en met force, zodat elk pad op het juiste adres uitkomt.
[[redirects]]
  from = "https://neoaccounting.nl/*"
  to = "https://www.neoaccounting.nl/:splat"
  status = 301
  force = true
